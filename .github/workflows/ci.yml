name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# 与 release.yml 尽量保持一致：同样的构建矩阵，仅触发时机不同（CI=push/PR，Release=tag）。
env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend deps
        run: python -m pip install --upgrade pip fastapi uvicorn

      - name: Import check
        run: |
          python -c "import sys; sys.path.insert(0, '.'); import backend; from backend.core.updater import updater; from backend.api.v1 import health, update; print('backend ok', backend.__version__)"

      - name: Update flow test (local mock)
        run: python scripts/test_update_flow.py

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = (Select-String -Path backend/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python deps
        run: python -m pip install --upgrade pip fastapi uvicorn pywebview pyinstaller

      - name: Build application (PyInstaller onedir)
        run: python -m PyInstaller build/pyinstaller.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/app_demo -DestinationPath "app_demo-win-x64-${{ steps.ver.outputs.version }}.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" "build\installer.iss"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            app_demo-win-x64-*.zip
            dist/installer/*.exe
          if-no-files-found: error

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system deps (GTK/WebKit/PyGObject)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libwebkit2gtk-4.1-0 \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            python3-gi

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python build deps
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user pyinstaller fastapi "uvicorn[standard]"
          # pywebview 的 PyGObject 依赖属于 gtk extra，默认不随普通安装拉取；
          # 运行时由系统 apt 安装的 python3-gi 提供，避免引入与系统 Python 不兼容的 PyPI 轮子。
          python3 -m pip install --user pywebview

      - name: Build application (PyInstaller onedir)
        run: python3 -m PyInstaller build/pyinstaller.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/app_demo
          if-no-files-found: error
