name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        run: python -m pip install --upgrade pip fastapi uvicorn

      - name: Import check
        run: |
          python -c "import sys; sys.path.insert(0, '.'); import backend; from backend.core.updater import updater; from backend.api.v1 import health, update; print('backend ok', backend.__version__)"

      - name: Update flow test (local mock)
        run: python scripts/test_update_flow.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web_dist
          path: backend/web_dist

  linux:
    name: Build & Smoke Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system deps (GTK/WebKit/PyGObject + xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libwebkit2gtk-4.1-0 \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            python3-gi xvfb

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python build deps
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user pyinstaller fastapi "uvicorn[standard]"
          # pywebview 的 PyGObject 依赖属于 gtk extra，默认不随普通安装拉取；
          # 运行时由系统 apt 安装的 python3-gi 提供，避免引入与系统 Python 不兼容的 PyPI 轮子。
          python3 -m pip install --user pywebview

      - name: Build application (PyInstaller onedir)
        run: python3 -m PyInstaller build/pyinstaller.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Smoke test (headless via xvfb)
        run: |
          xvfb-run -a ./dist/app_demo/app_demo --smoke | tee smoke.log
          grep -q "SMOKE_OK" smoke.log || { echo "冒烟自检未通过"; exit 1; }

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/app_demo
          if-no-files-found: error
