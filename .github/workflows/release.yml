name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 0.1.0），仅用于手动触发'
        required: false

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = (Select-String -Path backend/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python deps
        run: python -m pip install --upgrade pip fastapi uvicorn pywebview pyinstaller

      - name: Build application (PyInstaller onedir)
        run: python -m PyInstaller build/pyinstaller.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/app_demo -DestinationPath "app_demo-win-x64-${{ steps.ver.outputs.version }}.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" "build\installer.iss"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            app_demo-win-x64-*.zip
            dist/installer/*.exe
          if-no-files-found: error

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    # Linux 构建为尽力而为：即使失败也不阻塞 Windows 发布
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system deps (GTK/WebKit for pywebview)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 patchelf

      - name: Read version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v=$(grep -oP '__version__\s*=\s*"\K[^"]+' backend/__init__.py)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python deps
        run: python -m pip install --upgrade pip fastapi uvicorn pywebview pyinstaller

      - name: Build application
        run: python -m PyInstaller build/pyinstaller.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Package tar.gz
        run: tar -czf "app_demo-linux-x64-${{ steps.ver.outputs.version }}.tar.gz" -C dist app_demo

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: app_demo-linux-x64-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [ windows, linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f -printf '%p (%s bytes)\n'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body_path: CHANGELOG.md
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.exe
