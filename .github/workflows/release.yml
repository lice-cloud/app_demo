name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 0.1.0），仅用于手动触发'
        required: false

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend deps
        run: python -m pip install --upgrade pip fastapi uvicorn

      - name: Import check
        run: |
          python -c "import sys; sys.path.insert(0, '.'); import backend; from backend.core.updater import updater; from backend.api.v1 import health, update; print('backend ok', backend.__version__)"

      - name: Update flow test (local mock)
        run: python scripts/test_update_flow.py

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = (Select-String -Path backend/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python deps
        run: python -m pip install --upgrade pip fastapi uvicorn pywebview pyinstaller

      - name: Build application (PyInstaller onedir)
        run: python -m PyInstaller build/pyinstaller.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/app_demo -DestinationPath "app_demo-win-x64-${{ steps.ver.outputs.version }}.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" "build\installer.iss"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            app_demo-win-x64-*.zip
            dist/installer/*.exe
          if-no-files-found: error

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Linux 上 pywebview 使用 GTK/WebKit 后端，需要系统提供 PyGObject 与
      # GIR 类型库；否则冻结产物虽能生成，但运行时 import gi 失败无法启动。
      - name: Install system deps (GTK/WebKit/PyGObject)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libwebkit2gtk-4.1-0 \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            python3-gi

      - name: Read version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v=$(grep -oP '__version__\s*=\s*"\K[^"]+' backend/__init__.py)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python build deps
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user pyinstaller fastapi "uvicorn[standard]"
          # pywebview 的 PyGObject 依赖属于 gtk extra，默认不随普通安装拉取；
          # 运行时由系统 apt 安装的 python3-gi 提供，避免引入与系统 Python 不兼容的 PyPI 轮子。
          python3 -m pip install --user pywebview

      - name: Build application
        run: python3 -m PyInstaller build/pyinstaller.spec --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Package tar.gz
        run: tar -czf "app_demo-linux-x64-${{ steps.ver.outputs.version }}.tar.gz" -C dist app_demo

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: app_demo-linux-x64-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [ backend, windows, linux ]
    runs-on: ubuntu-latest
    steps:
      # 必须 checkout，否则 body_path 使用的 CHANGELOG.md 不存在（此前导致 Release body 为空）
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f -printf '%p (%s bytes)\n'

      # 只提取当前版本的更新说明，避免把历史版本一并塞进更新弹窗
      - name: Extract release notes for this version
        run: |
          python - <<'PY'
          import re, pathlib
          ver = re.search(
              r'__version__\s*=\s*"([^"]+)"',
              pathlib.Path("backend/__init__.py").read_text(encoding="utf-8"),
          ).group(1)
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          out, capture = [], False
          for ln in text.splitlines():
              if ln.strip().startswith("## "):
                  if ver in ln:
                      capture = True
                      continue
                  elif capture:
                      break
              if capture:
                  out.append(ln)
          body = "\n".join(out).strip()
          if not body:
              body = text  # 兜底：使用完整 CHANGELOG
          pathlib.Path("release_notes.md").write_text(body, encoding="utf-8")
          print("Release notes for v%s (%d chars):" % (ver, len(body)))
          print(body)
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body_path: release_notes.md
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.exe
